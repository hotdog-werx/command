[setup]
# depends = ["python:uv-sync", "workspace:pnpm-install"]
depends = ["workspace:pnpm-install"]
run = "echo Ready!"

[format]
# depends = ["python:format", "workspace:dprint:format"]
depends = ["workspace:dprint:format"]

["action:typecheck"]
description = "Typecheck src/ with tsc (native TypeScript 7)"
run = "tsc -p tsconfig.json"

["action:build"]
description = "Bundle src/main.ts to dist/ with esbuild (replaces ncc)"
depends = ["action:typecheck"]
run = "node script/build.mjs"

["action:test"]
description = "Run the vitest suite with coverage and refresh the coverage badge"
depends = ["action:typecheck"]
run = "(pnpm exec vitest run && pnpm exec make-coverage-badge --output-path ./badges/coverage.svg) || pnpm exec make-coverage-badge --output-path ./badges/coverage.svg"

["action:dist-check"]
description = "Rebuild dist/ and fail if it differs from the committed bundle"
depends = ["action:build"]
run = """
if [ -n "$(git diff --ignore-space-at-eol -- dist/)" ]; then
  echo "Detected uncommitted changes in dist/ after rebuild:"
  git diff -- dist/
  exit 1
fi
"""
